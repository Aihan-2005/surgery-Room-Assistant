# Replace api.example.com and certificate paths with the real API domain.
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Includes the multipart envelope around a 5 MiB photo.
    client_max_body_size 6m;

    location /static/ {
        alias /var/lib/airway/static/;
    }

    # Images must pass Django's device/admin authorization.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite untrusted client forwarding headers; NUM_PROXIES is 1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
    }
}
